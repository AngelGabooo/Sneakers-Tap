<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sneakers POS — Iniciar sesión</title>

    <!-- ⭐ PWA Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ⭐ iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sneakers" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ⭐ Theme color (barra de estado en Android) -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- 🌗 Script anti-flash: aplica el tema antes de renderizar -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('sneakers-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
